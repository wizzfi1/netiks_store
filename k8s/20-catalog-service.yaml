apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: netiks
spec:
  selector:
    app: catalog-service
  ports:
    - port: 8003
      targetPort: 8003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: netiks
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until pg_isready -h postgres -p 5432; do echo waiting for postgres; sleep 2; done
      containers:
        - name: catalog-service
          image: netiks/catalog-service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8003
          env:
            - name: APP_NAME
              value: catalog-service
            - name: APP_PORT
              value: "8003"
          envFrom:
            - configMapRef:
                name: netiks-config
            - secretRef:
                name: netiks-secrets
          startupProbe:
            httpGet:
              path: /health/live
              port: 8003
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8003
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8003
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
