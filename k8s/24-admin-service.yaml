apiVersion: v1
kind: Service
metadata:
  name: admin-service
  namespace: netiks
spec:
  selector:
    app: admin-service
  ports:
    - port: 8005
      targetPort: 8005
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-service
  namespace: netiks
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-service
  template:
    metadata:
      labels:
        app: admin-service
    spec:
      enableServiceLinks: false
      containers:
        - name: admin-service
          image: netiks/admin-service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8005
          env:
            - name: APP_NAME
              value: admin-service
            - name: APP_PORT
              value: "8005"
          envFrom:
            - configMapRef:
                name: netiks-config
            - secretRef:
                name: netiks-secrets
          startupProbe:
            httpGet:
              path: /health/live
              port: 8005
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8005
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8005
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
